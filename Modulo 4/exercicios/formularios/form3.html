<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 2</title>
</head>
<body>
    <h1>Aluno</h1>
    <form action="python.py" method="post">
        <p><label for="inome">Nome:</label> <input type="text" name="nome" id="inome" required></p>
        <p><label for="imedia">Media:</label> <input type="number" name="media" id="imedia" required></p>

        <p><label for="imes">Mês:</label> <input type="month" name="mes" id="imes"></p>
        <p><label for="idia">Dia da Prova:</label> <input type="date" name="dia" id="idia"></p>
        <p><label for="ihora">Horario da Prova:</label> <input type="time" name="hora" id="ihora"></p>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>
</body>
</html>
