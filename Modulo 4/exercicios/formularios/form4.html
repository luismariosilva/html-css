<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 4</title>
</head>
<body>
    <h1>Centro de cadastro</h1>
    <form action="python.py" method="post">
        <fieldset>
            <p><label for="inome">Nome:</label> <input type="text" name="nome" id="inome" required></p>
            <p><label for="imail">Email:</label> <input type="email" name="email" id="imail" required></p>
            <p><label for="itel">Telefone:</label> <input type="tel" name="tel" id="itel" required></p>
            
        </fieldset>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>
</body>
</html>
