<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 5</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="python.py" method="post">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="maxo" id="maxo"> <label for="maxo">Masculino</label> <br>
            <input type="radio" name="maxo" id="feminino"> <label for="feminino">Feminino</label>
            
        </fieldset>
        <fieldset>
            <legend>Esportes favoritas</legend>
            <p><label for="futebol">Futebol:</label> <input type="checkbox" name="futebol" id="futebol"></p>
            <p><label for="basket">Basquete:</label> <input type="checkbox" name="basket" id="basket"></p>
            <p><label for="natacao">Natação:</label> <input type="checkbox" name="natacao" id="natacao"></p>
            <p><label for="volei">Volei:</label> <input type="checkbox" name="volei" id="volei"></p>
        </fieldset>
    </form>
</body>
</html>
