<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 2</title>
</head>
<body>
    <h1>Cadastro de usuário</h1>
    <form action="python.py" method="post">
        <p><label for="inome">Usuario:</label> <input type="text" name="nome" id="inome" required></p>
        <p><label for="isenha">Senha:</label> <input type="password" name="senha" id="isenha" required></p>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>
</body>
</html>
