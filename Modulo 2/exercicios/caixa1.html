<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixas</title>
    <style>
        h1 {
            background-color: aqua;
            width: 300px;
            height: 300px;
            padding: 10px;
            border-radius: 15px;
            border-style: solid;
            border-color: bisque;
            margin: auto;
        }

        a {
            background-color: mistyrose;
            display: block;
            width: 400px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragrafos tambem são exemplos de caixas box-level, mais os <a href="#">mais os links são exemplos de caixas inline-Level</a> Vamos ver como isso funciona.</p>
</body>
</html>
